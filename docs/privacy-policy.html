<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=privacy.html">
<title>Mesai+ — Gizlilik Politikası</title>
<link rel="canonical" href="privacy.html">
<style>
  :root { --bg: #F8FAFC; --surface: #FFFFFF; --border: rgba(100,116,139,0.24); --text: #0F172A; --text-muted: #475569; --primary: #1D4ED8; --primary-dark: #1E3A8A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px 32px; max-width: 420px; width: 100%; text-align: center; }
  .brand-name { font-size: 22px; font-weight: 800; letter-spacing: 0.2px; margin-bottom: 4px; }
  .brand-name .plus { color: var(--primary); }
  h1 { font-size: 17px; font-weight: 700; color: var(--primary-dark); margin: 4px 0 16px; }
  p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin: 0 0 20px; }
  a.link { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; padding: 12px 24px; border-radius: 10px; }
  a.link:hover { background: var(--primary-dark); }
</style>
</head>
<body>
  <div class="center">
    <div class="card">
      <div class="brand-name">Mesai<span class="plus">+</span></div>
      <h1>Gizlilik Politikası</h1>
      <p>Bu sayfa taşındı. Otomatik yönlendirme çalışmazsa aşağıdaki bağlantıyı kullanabilirsiniz.</p>
      <a class="link" href="privacy.html">Gizlilik Politikasını Aç</a>
    </div>
  </div>
</body>
</html>
